[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cliniar"
version = "0.21.4"
description = "Self-hosted, offline-first, agent-native work management with Linear compatibility"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
maintainers = [
    { name = "Rinadelph" },
]
keywords = ["linear", "cli", "issue-tracker", "pydantic", "graphql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.10,<3.0",
    "httpx>=0.27,<1.0",
    "typer>=0.15,<1.0",
    "rich>=13.9,<15.0",
    "tomli>=2.0;python_version<'3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
]
mcp = [
    "mcp>=2.2.0,<3.0.0",
]
server = [
    "ariadne>=0.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",
]
saas = [
    "asyncpg>=0.29",
]
agent = [
    "pydantic-ai-slim[dbos,openai,mcp]>=2.54,<3.0",
    "google-workspace-connector",
]

[tool.uv.sources]
google-workspace-connector = { path = "connectors/google_workspace", editable = true }

[project.scripts]
cliniar = "cliniar.cli:app"
cliniar-mcp = "cliniar.mcp.server:main"
cliniar-serve = "cliniar_server.cli:main"

[project.urls]
Homepage = "https://github.com/rinadelph/cliniar"
Documentation = "https://github.com/rinadelph/cliniar/blob/main/docs/DESIGN.md"
Issues = "https://github.com/rinadelph/cliniar/issues"

[tool.hatch.build.targets.wheel]
packages = ["cliniar", "cliniar_server"]
artifacts = ["VERSION"]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "VERSION"
"cliniar_server/schema.graphql" = "cliniar_server/schema.graphql"
"connectors/google_workspace/src/google_workspace" = "google_workspace"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
