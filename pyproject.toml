[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
# The PyPI distribution is `hoja-cli`; it installs the `hoja`, `hoja-mcp`, and
# `hoja-serve` commands. It cannot be named `hoja` because that PyPI project
# belongs to unrelated software, so the distribution carries the `-cli` suffix
# while its summary, keywords, and URLs state that it is the Hoja CLI.
name = "hoja-cli"
version = "0.21.5"
description = "Hoja CLI and local server: self-hosted, offline-first, agent-native work management with a Linear-compatible GraphQL API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
maintainers = [
    { name = "Rinadelph" },
]
keywords = ["hoja", "linear", "cli", "issue-tracker", "work-management", "pydantic", "graphql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.10,<3.0",
    "cryptography>=42,<60",
    "httpx>=0.27,<1.0",
    "typer>=0.15,<1.0",
    "rich>=15.0.0,<16.0",
    "tomli>=2.0;python_version<'3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
]
mcp = [
    "mcp>=2.2.0,<3.0.0",
]
server = [
    # `create_app` mounts the MCP endpoint at /mcp and its OAuth routes
    # unconditionally, so a server that can actually serve needs the MCP SDK.
    # Keep `mcp` listed here as well: the dedicated extra remains for installs
    # that only want the stdio bridge, and both spell sites must agree.
    "mcp>=2.2.0,<3.0.0",
    # ariadne 0.23 caps graphql-core at <3.3, but hoja_server/extensions.py
    # imports validate_input_value, which only exists in graphql-core 3.3+.
    # Declare both halves of the pair so the resolver cannot pick an
    # importable-looking but unstartable combination.
    "ariadne>=1.1",
    "graphql-core>=3.3,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",
]
saas = [
    "asyncpg>=0.29",
]
agent = [
    "pydantic-ai-slim[dbos,openai,mcp]>=2.54,<3.0",
    "google-workspace-connector",
    "notion-connector",
    "slack-connector",
    "calendly-connector",
    "sentry-connector",
    "zoom-connector",
    "grafana-connector",
    "github-connector",
]

[tool.uv.sources]
google-workspace-connector = { path = "connectors/google_workspace", editable = true }
notion-connector = { path = "connectors/notion", editable = true }
slack-connector = { path = "connectors/slack", editable = true }
calendly-connector = { path = "connectors/calendly", editable = true }
sentry-connector = { path = "connectors/sentry", editable = true }
zoom-connector = { path = "connectors/zoom", editable = true }
grafana-connector = { path = "connectors/grafana", editable = true }
github-connector = { path = "connectors/github", editable = true }

[project.scripts]
hoja = "hoja.cli:app"
hoja-mcp = "hoja.mcp.server:main"
hoja-serve = "hoja_server.cli:main"

[project.urls]
Homepage = "https://github.com/hoja-work/hoja"
Repository = "https://github.com/hoja-work/hoja"
Documentation = "https://github.com/hoja-work/hoja/blob/main/docs/DESIGN.md"
Issues = "https://github.com/hoja-work/hoja/issues"
Changelog = "https://github.com/hoja-work/hoja/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["hoja", "hoja_server"]
artifacts = ["VERSION"]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "VERSION"
"hoja_server/schema.graphql" = "hoja_server/schema.graphql"
"connectors/google_workspace/src/google_workspace" = "google_workspace"
"connectors/notion/src/notion" = "notion"
"connectors/slack/src/slack" = "slack"
"connectors/calendly/src/calendly" = "calendly"
"connectors/sentry/src/sentry" = "sentry"
"connectors/zoom/src/zoom" = "zoom"
"connectors/grafana/src/grafana" = "grafana"
"connectors/github/src/github" = "github"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Provider-shaped models mirror Grafana's JSON field names on purpose: renaming `isGrafanaAdmin`
# or `folderUid` would lose the one-to-one mapping this client is built on.
"connectors/grafana/src/grafana/client.py" = ["N815"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
