# Linear-compatible GraphQL SDL — the subset cliniar actually uses.
# Field names are EXACT camelCase; cliniar's Pydantic models alias to these.

scalar DateTime
scalar TimelessDate
scalar JSON

type Organization {
  id: ID!
  name: String!
  urlKey: String!
}

type ApiKey {
  id: ID!
  label: String
  access: String
  hint: String
  expiresAt: DateTime
  lastUsedAt: DateTime
  createdAt: DateTime
  revokedAt: DateTime
}

type ApiKeyPayload {
  success: Boolean!
  apiKey: ApiKey
  secret: String
}

type UserPreferencesPayload {
  success: Boolean!
  theme: String
  fontSize: String
}


type NotificationPreferencesPayload {
  success: Boolean!
  issueCreated: Boolean!
  issueUpdated: Boolean!
}

type WorkspaceMembership {
  id: ID!
  organizationId: ID!
  name: String!
  urlKey: String!
  role: String!
}

type OrganizationPayload {
  success: Boolean!
  organization: Organization
}

type UserPayload {
  success: Boolean!
  user: User
  apiKey: String
  inviteCode: String
}

input InitiativeCreateInput { name: String! summary: String status: String priority: Int ownerId: String targetDate: TimelessDate projectIds: [String!] }
input InitiativeUpdateInput { name: String summary: String status: String priority: Int ownerId: String targetDate: TimelessDate projectIds: [String!] }

input WorkspaceUpdateInput {
  name: String
  urlKey: String
}

input WorkspaceCreateInput {
  name: String!
  urlKey: String!
}

input MemberInviteInput {
  email: String!
  name: String!
  admin: Boolean = false
  teamIds: [String!]
}

type Query {
  viewer: User
  myApiKeys: [ApiKey!]!
  myPreferences: UserPreferencesPayload!
  myNotificationPreferences: NotificationPreferencesPayload!
  issueLabelSettings: [IssueLabel!]!
  myWorkspaces: [WorkspaceMembership!]!
  organizationMembers(first: Int = 100): UserConnection
  pendingMembershipInvitations: [PendingMembershipInvitation!]!
  workspace: Organization
  teams(first: Int = 50, after: String, filter: TeamFilter): TeamConnection
  team(id: String!): Team
  issues(filter: IssueFilter, first: Int = 50, after: String, orderBy: PaginationOrderBy): IssueConnection
  issue(id: String!): Issue
  myIssueActivity(first: Int = 50, after: String): MyIssueActivityConnection
  inboxNotifications(first: Int = 50, after: String, unreadOnly: Boolean = false, archived: Boolean = false): InboxNotificationConnection
  inboxUnreadCount: Int!
  projects(filter: ProjectFilter, first: Int = 50, after: String): ProjectConnection
  initiatives(first: Int = 50, after: String, status: String): InitiativeConnection
  initiative(id: String!): Initiative
  projectUpdates(first: Int = 50, after: String, filter: ProjectUpdateFilter): ProjectUpdateConnection
  project(id: String!): Project
  workflowStates(filter: WorkflowStateFilter, first: Int = 100, after: String): WorkflowStateConnection
  cycles(filter: CycleFilter, first: Int = 100, after: String): CycleConnection
  cycle(id: String!): Cycle
  teamCycleCadence(teamId: String!): TeamCycleCadence!
  issueLabels(filter: IssueLabelFilter, first: Int = 100, after: String): IssueLabelConnection
  searchIssues(term: String!, first: Int = 20): IssueConnection
  rateLimitStatus: RateLimitPayload
}

type Mutation {
  apiKeyCreate(label: String!, access: String = "read_write", expiresAt: DateTime): ApiKeyPayload
  apiKeyRevoke(id: String!): Boolean!
  userPreferenceSet(key: String!, value: String!): UserPreferencesPayload!
  profileNameUpdate(name: String!): UserPayload
  notificationPreferenceSet(kind: String!, enabled: Boolean!): NotificationPreferencesPayload!
  workspaceCreate(input: WorkspaceCreateInput!): OrganizationPayload
  teamCreate(input: TeamCreateInput!): TeamPayload
  teamUpdate(id: String!, input: TeamUpdateInput!): TeamPayload
  teamArchive(id: String!): DeletePayload
  teamDelete(id: String!): DeletePayload
  workspaceSwitch(organizationId: String!): OrganizationPayload
  membershipInvitationCreate(userId: String!): UserPayload
  membershipInvitationAccept(code: String!, inviteePassword: String!): OrganizationPayload
  membershipInvitationRevoke(userId: String!): DeletePayload
  memberDeactivate(userId: String!): UserPayload
  memberReactivate(userId: String!): UserPayload
  workspaceUpdate(input: WorkspaceUpdateInput!): OrganizationPayload
  memberInvite(input: MemberInviteInput!): UserPayload
  memberRoleUpdate(userId: String!, admin: Boolean!): UserPayload
  teamMemberAdd(teamId: String!, userId: String!): UserPayload
  teamMemberRemove(teamId: String!, userId: String!): UserPayload
  issueCreate(input: IssueCreateInput!): IssuePayload
  issueUpdate(id: String!, input: IssueUpdateInput!): IssuePayload
  notificationMarkRead(id: String!): Boolean!
  notificationArchive(id: String!): Boolean!
  notificationMarkAllRead: Boolean!
  issueDelete(id: String!): DeletePayload
  issueArchive(id: String!): DeletePayload
  commentCreate(input: CommentCreateInput!): CommentPayload
  commentUpdate(id: String!, input: CommentUpdateInput!): CommentPayload
  commentDelete(id: String!): DeletePayload
  issueLabelCreate(input: IssueLabelCreateInput!): IssueLabelPayload
  issueLabelDelete(id: String!): DeletePayload
  issueLabelUpdate(id: String!, input: IssueLabelUpdateInput!): IssueLabelPayload
  projectCreate(input: ProjectCreateInput!): ProjectPayload
  projectUpdate(id: String!, input: ProjectUpdateInput!): ProjectPayload
  projectUpdateCreate(input: ProjectUpdateCreateInput!): ProjectUpdatePayload
  projectArchive(id: String!): DeletePayload
  teamCycleCadenceEnable(teamId: String!, weekday: Int!): TeamCycleCadence!
  initiativeCreate(input: InitiativeCreateInput!): InitiativePayload
  initiativeUpdate(id: String!, input: InitiativeUpdateInput!): InitiativePayload
  initiativeArchive(id: String!): DeletePayload
  attachmentCreate(input: AttachmentCreateInput!): AttachmentPayload
}

enum PaginationOrderBy { createdAt updatedAt }

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type InboxNotification {
  id: ID!
  issue: Issue!
  actor: User
  kind: String!
  createdAt: DateTime!
  readAt: DateTime
  archivedAt: DateTime
}
type InboxNotificationConnection { nodes: [InboxNotification!]! pageInfo: PageInfo! }

type User {
  id: ID!
  name: String
  displayName: String
  email: String
  active: Boolean
  isMe: Boolean
  admin: Boolean
  avatarUrl: String
  url: String
  timezone: String
  statusEmoji: String
  statusLabel: String
  createdAt: DateTime
  updatedAt: DateTime
}

type Team {
  id: ID!
  name: String!
  key: String!
  description: String
  color: String
  icon: String
  private: Boolean
  timezone: String
  createdAt: DateTime
  updatedAt: DateTime
  states(first: Int = 100): WorkflowStateConnection
  members(first: Int = 100): UserConnection
  cycles(first: Int = 50): CycleConnection
  activeCycle: Cycle
}

type WorkflowState {
  id: ID!
  name: String!
  color: String
  description: String
  position: Float
  type: String!
  createdAt: DateTime
  updatedAt: DateTime
  team: Team
}

type IssueLabel {
  id: ID!
  name: String!
  color: String
  description: String
  createdAt: DateTime
  updatedAt: DateTime
}

type TeamCycleCadence { enabled: Boolean! weekday: Int timezone: String! policyVersion: Int! activeCycle: Cycle upcomingCycles: [Cycle!]! }

type Cycle {
  id: ID!
  name: String
  number: Int
  startsAt: DateTime
  endsAt: DateTime
  completedAt: DateTime
  progress: Float
  createdAt: DateTime
  updatedAt: DateTime
  team: Team
}

type Project {
  id: ID!
  name: String!
  description: String
  slugId: String
  icon: String
  color: String
  state: String
  progress: Float
  startDate: TimelessDate
  targetDate: TimelessDate
  url: String
  lead: User
  creator: User
  members(first: Int = 100): UserConnection
  teams(first: Int = 100): TeamConnection
  health: String
  createdAt: DateTime
  updatedAt: DateTime
}

input ProjectUpdateFilter { project: ProjectFilter }

type ProjectUpdate {
  id: ID!
  project: Project!
  status: String
  body: String!
  createdAt: DateTime!
  actor: User
  progress: Float
  health: String
}
type ProjectUpdatePayload { success: Boolean! projectUpdate: ProjectUpdate }

type Comment {
  id: ID!
  body: String!
  url: String
  user: User
  createdAt: DateTime
  updatedAt: DateTime
}

type Issue {
  id: ID!
  identifier: String!
  title: String!
  description: String
  priority: Int
  priorityLabel: String
  estimate: Float
  url: String
  branchName: String
  number: Int
  createdAt: DateTime
  updatedAt: DateTime
  dueDate: DateTime
  completedAt: DateTime
  canceledAt: DateTime
  startedAt: DateTime
  stateChangedAt: DateTime
  snoozedUntilAt: DateTime
  state: WorkflowState
  assignee: User
  creator: User
  team: Team
  project: Project
  cycle: Cycle
  parent: Issue
  labels(first: Int = 50): IssueLabelConnection
  subscribers(first: Int = 50): UserConnection
  comments(first: Int = 50): CommentConnection
  activity(first: Int = 50, after: String): IssueActivityConnection
}

type UserConnection { nodes: [User!]! pageInfo: PageInfo! }
type TeamPayload { success: Boolean! team: Team }
type TeamConnection { nodes: [Team!]! pageInfo: PageInfo! }
type WorkflowStateConnection { nodes: [WorkflowState!]! pageInfo: PageInfo! }
type IssueConnection { nodes: [Issue!]! pageInfo: PageInfo! }
type IssueLabelConnection { nodes: [IssueLabel!]! pageInfo: PageInfo! }
type ProjectConnection { nodes: [Project!]! pageInfo: PageInfo! }
type InitiativeConnection { nodes: [Initiative!]! pageInfo: PageInfo! }
type Initiative { id: ID! name: String! summary: String status: String! priority: Int! owner: User creator: User targetDate: TimelessDate createdAt: DateTime! updatedAt: DateTime! projects: ProjectConnection! }
type InitiativePayload { success: Boolean! initiative: Initiative }
type ProjectUpdateConnection { nodes: [ProjectUpdate!]! pageInfo: PageInfo! }
type CycleConnection { nodes: [Cycle!]! pageInfo: PageInfo! }
type CommentConnection { nodes: [Comment!]! pageInfo: PageInfo! }
type IssueActivity { id: ID! eventType: String! actor: User changes: JSON createdAt: DateTime! }
type IssueActivityConnection { nodes: [IssueActivity!]! pageInfo: PageInfo! }
type MyIssueActivity { id: ID! issue: Issue! eventType: String! actor: User changes: JSON createdAt: DateTime! }
type MyIssueActivityConnection { nodes: [MyIssueActivity!]! pageInfo: PageInfo! }

type IssuePayload { success: Boolean! issue: Issue }
type CommentPayload { success: Boolean! comment: Comment }
type IssueLabelPayload { success: Boolean! issueLabel: IssueLabel }
type ProjectPayload { success: Boolean! project: Project }
type DeletePayload { success: Boolean! }
type PendingMembershipInvitation { userId: ID! name: String email: String expiresAt: DateTime }
type AttachmentPayload { success: Boolean! attachment: Attachment }
type Attachment {
  id: ID!
  url: String!
  title: String!
  subtitle: String
  issue: Issue
  createdAt: DateTime
}

type RateLimitPayload {
  identifier: String
  kind: String
  limit: Int
  remaining: Int
  requestsPerHour: Int
  resetsAt: DateTime
}

# ---- Filter inputs (comparators cliniar emits) ----
input StringComparator {
  eq: String
  neq: String
  in: [String!]
  nin: [String!]
  contains: String
  containsIgnoreCase: String
  eqIgnoreCase: String
}
input IDComparator { eq: ID in: [ID!] neq: ID }
input NumberComparator { eq: Float neq: Float gt: Float lt: Float gte: Float lte: Float in: [Float!] }
input DateComparator { eq: DateTime neq: DateTime gt: DateTime lt: DateTime gte: DateTime lte: DateTime }
input BooleanComparator { eq: Boolean neq: Boolean }

input TeamFilter { key: StringComparator id: IDComparator name: StringComparator }
input UserFilter { id: IDComparator email: StringComparator displayName: StringComparator name: StringComparator }
input WorkflowStateFilter { name: StringComparator type: StringComparator team: TeamFilter }
input CycleFilter { id: IDComparator name: StringComparator team: TeamFilter isActive: BooleanComparator isNext: BooleanComparator }
input ProjectRelFilter { id: IDComparator name: StringComparator }
input LabelRelFilter { name: StringComparator }

input IssueFilter {
  identifier: StringComparator
  team: TeamFilter
  state: WorkflowStateFilter
  assignee: UserFilter
  creator: UserFilter
  project: ProjectRelFilter
  cycle: CycleFilter
  labels: LabelRelFilter
  priority: NumberComparator
  number: NumberComparator
  title: StringComparator
  description: StringComparator
  updatedAt: DateComparator
  createdAt: DateComparator
  dueDate: DateComparator
  and: [IssueFilter!]
  or: [IssueFilter!]
}

input ProjectFilter { id: IDComparator slugId: StringComparator name: StringComparator state: StringComparator team: TeamFilter }
input IssueLabelFilter { team: TeamFilter name: StringComparator }

# ---- Mutation inputs ----
input TeamUpdateInput { name: String key: String description: String }
input TeamCreateInput { name: String! key: String! description: String color: String icon: String private: Boolean timezone: String memberIds: [String!] }
input IssueCreateInput {
  title: String!
  teamId: String!
  description: String
  priority: Int
  stateId: String
  assigneeId: String
  projectId: String
  cycleId: String
  parentId: String
  estimate: Float
  dueDate: DateTime
  labelIds: [String!]
}
input IssueUpdateInput {
  title: String
  description: String
  priority: Int
  stateId: String
  assigneeId: String
  projectId: String
  cycleId: String
  parentId: String
  estimate: Float
  dueDate: DateTime
  labelIds: [String!]
}
input CommentCreateInput { issueId: String! body: String! }
input CommentUpdateInput { body: String }
input IssueLabelUpdateInput { name: String color: String description: String }
input IssueLabelCreateInput { name: String! teamId: String color: String description: String }
input ProjectCreateInput { name: String! description: String teamIds: [String!] leadId: String state: String color: String icon: String startDate: TimelessDate targetDate: TimelessDate }
input ProjectUpdateInput { name: String description: String leadId: String state: String color: String icon: String startDate: TimelessDate targetDate: TimelessDate }
input ProjectUpdateCreateInput { projectId: String! body: String! status: String }
input AttachmentCreateInput { issueId: String! url: String! title: String! subtitle: String }
