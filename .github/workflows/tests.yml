name: Tests

# The public OSS repository ships 1158 tests and, until this workflow, ran
# none of them: Documentation exercised `tests/test_check_docs.py` only, and
# Dependency audit ran npm/pip advisories. Every behavioural claim in this
# repository was therefore green by absence. Keep this job un-filtered so a
# pull request cannot become "green" by touching a path the matrix ignores.
#
# `pytest` proves the SQLite path. It cannot prove the Postgres path: every test
# gated on HOJA_TEST_POSTGRES_URL reports as *skipped* there, and pytest exits 0
# for a run made entirely of skips. The row-level-security tests in
# tests/test_tenant_context.py and the legacy-column upgrade probe in
# tests/test_server_postgres.py are in that set, so `pytest-postgres` runs them
# against a real server and fails if any of them skipped instead of ran.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-vocabulary:
    # HOJA-288 moved the product vocabulary from "issue" to "task". The GraphQL
    # and MCP aliases are covered by pytest; user-visible copy lives in JSX text
    # and accessible attributes, which no Python test reads. This job runs the
    # same gate locally via `npm run lint:vocab`.
    name: frontend-vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install frontend dependencies
        # The gate parses TSX with the TypeScript compiler, so it needs node_modules.
        run: npm ci --prefix frontend
      - name: User-facing vocabulary
        run: node frontend/scripts/check-task-vocabulary.mjs
      - name: Vocabulary gate catches what it claims to catch
        run: node frontend/scripts/test-task-vocabulary-gate.mjs

  pytest:
    # A stable name for branch protection; do not rename without updating it.
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'

      # --all-extras because the suite covers the server, MCP and SaaS extras;
      # without them the collection import fails rather than skipping.
      - name: Install
        run: uv sync --frozen --all-extras

      - name: Test suite
        # faulthandler_timeout mirrors the Cloud runner so a hang dumps stacks
        # instead of consuming the whole job timeout.
        # tests/e2e needs a browser and a built web bundle; `pytest-e2e` owns
        # it. Leaving it here as well would only add skips that read like the
        # Postgres-gated ones, and would tie this job's runtime to a browser.
        run: >-
          uv run --frozen --all-extras pytest -q -o faulthandler_timeout=240
          --ignore=tests/e2e

  pytest-e2e:
    # HOJA-375: playwright was never installed, so every case in tests/e2e
    # skipped and the browser suite was green by absence. This job installs
    # the package, a real chromium and the web bundle it drives, then asserts
    # the cases ran instead of trusting the colour of the check.
    name: pytest-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install
        run: uv sync --frozen --all-extras

      # hoja_server serves frontend/dist and answers the root with an
      # instruction page when it is absent, so the suite needs this build.
      - name: Build the web bundle
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: Install chromium
        run: uv run --frozen --all-extras playwright install --with-deps chromium

      - name: Browser suite
        run: >-
          uv run --frozen --all-extras pytest -q -rs
          --junit-xml=e2e-results.xml
          -o faulthandler_timeout=240
          tests/e2e

      # Runs even when the step above failed, so a broken browser path reports
      # both the failing assertions and whether the cases ran at all.
      - name: Assert the browser tests executed
        if: always()
        run: python scripts/assert_e2e_gate_ran.py e2e-results.xml

  pytest-postgres:
    # Only the three database-gated modules; the SQLite job above owns the rest.
    name: pytest-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hoja
          POSTGRES_PASSWORD: hoja
          POSTGRES_DB: hoja_test
        ports:
          - 5432:5432
        # Without a health check the first connection races the server's startup
        # and the run fails for a reason that has nothing to do with the code.
        options: >-
          --health-cmd "pg_isready -U hoja -d hoja_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A TCP URL, not a socket: test_postgres_upgrade_from_legacy_private_column
      # derives a sibling database name by splitting this string on the last "/".
      HOJA_TEST_POSTGRES_URL: postgresql+psycopg://hoja:hoja@localhost:5432/hoja_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'

      - name: Install
        run: uv sync --frozen --all-extras

      - name: Database-backed tests
        run: >-
          uv run --frozen --all-extras pytest -q -rs
          --junit-xml=pg-results.xml
          -o faulthandler_timeout=240
          tests/test_server_postgres.py
          tests/test_tenant_context.py
          tests/agent/test_dbos_crash_recovery.py

      # Runs even when the step above failed, so a broken database path reports
      # both the failing assertions and whether the cases ran at all.
      - name: Assert the database tests executed
        if: always()
        run: python scripts/assert_pg_gate_ran.py pg-results.xml
