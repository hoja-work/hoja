name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anti-slop:
    # This exact name is required by main branch protection.
    name: Anti-slop documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check documentation
        run: python3 scripts/check_docs.py

      - name: Documentation vocabulary
        # Prose says "task"; API names stay inside `code spans`.
        run: python3 scripts/check_docs_vocabulary.py

      - name: Test documentation policy
        run: python3 -m unittest discover -s tests -p 'test_check_docs.py' -v
