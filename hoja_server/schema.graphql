# Linear-compatible GraphQL SDL — the subset hoja actually uses.
# Field names are EXACT camelCase; hoja's Pydantic models alias to these.

scalar DateTime
scalar TimelessDate
scalar JSON

type Organization {
  id: ID!
  name: String!
  urlKey: String!
  "Where this workspace is served: https://<its own host>, or the canonical app URL. Its GraphQL endpoint is <origin>/graphql and its MCP endpoint <origin>/mcp."
  origin: String!
}

type ApiKey {
  id: ID!
  label: String
  access: String
  hint: String
  expiresAt: DateTime
  lastUsedAt: DateTime
  createdAt: DateTime
  revokedAt: DateTime
}

type ApiKeyPayload {
  success: Boolean!
  apiKey: ApiKey
  secret: String
}

type UserPreferencesPayload {
  success: Boolean!
  theme: String
  fontSize: String
}


type NotificationPreferencesPayload {
  success: Boolean!
  issueAssigned: Boolean!
  projectMemberAdded: Boolean!
  issueMention: Boolean!
  issueComment: Boolean!
  issueStatusChanged: Boolean!
  issueUpdated: Boolean!
  issueDecision: Boolean!
  issueCreated: Boolean!
  projectUpdatePosted: Boolean!
  projectUpdateReply: Boolean!
  projectMention: Boolean!
  projectLeadAssigned: Boolean!
  projectUpdated: Boolean!
  initiativeUpdatePosted: Boolean!
  initiativeOwnerAssigned: Boolean!
  initiativeUpdated: Boolean!
  cycleStarted: Boolean!
  cycleCompleted: Boolean!
  "A followed view gained a task."
  viewIssueAdded: Boolean!
  "A task in a followed view was completed or canceled."
  viewIssueCompleted: Boolean!
}

type WorkspaceMembership {
  id: ID!
  organizationId: ID!
  name: String!
  urlKey: String!
  role: String!
  "Where this workspace is served; see Organization.origin."
  origin: String!
}

type OrganizationPayload {
  success: Boolean!
  organization: Organization
  """
  Set when the workspace must be opened on another host (its own address): the
  browser navigates here instead of switching in place. No session was changed.
  """
  redirectUrl: String
}

type UserPayload {
  success: Boolean!
  user: User
  apiKey: String
  inviteCode: String
  """True when the invitation email was accepted by the mail provider."""
  emailQueued: Boolean
}

input InitiativeCreateInput { name: String! summary: String description: String status: String priority: Int ownerId: String targetDate: TimelessDate projectIds: [String!] parentId: String icon: String color: String leadTeamId: String labelIds: [String!] updateReminder: String sortOrder: Float parentIds: [String!] slackChannelId: String slackChannelName: String }
input InitiativeUpdateInput { name: String summary: String description: String status: String priority: Int ownerId: String targetDate: TimelessDate projectIds: [String!] parentId: String icon: String color: String leadTeamId: String labelIds: [String!] updateReminder: String sortOrder: Float parentIds: [String!] addParentId: String removeParentId: String slackChannelId: String slackChannelName: String }

input WorkspaceUpdateInput {
  name: String
  urlKey: String
}

input WorkspaceCreateInput {
  name: String!
  urlKey: String!
}

input MemberInviteInput {
  email: String!
  name: String!
  admin: Boolean = false
  teamIds: [String!]
}

type Query {
  viewer: User
  myApiKeys: [ApiKey!]!
  "The workspace's append-only audit ledger, admin only, oldest first, paged."
  auditEvents(first: Int = 50, after: String, actorId: String, action: String): AuditEventConnection!
  myPreferences: UserPreferencesPayload!
  myNotificationPreferences: NotificationPreferencesPayload!
  issueLabelSettings: [IssueLabel!]! @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  myWorkspaces: [WorkspaceMembership!]!
  organizationMembers(first: Int = 100): UserConnection
  archivedMembers: [User!]!
  pendingMembershipInvitations: [PendingMembershipInvitation!]!
  workspace: Organization
  teams(first: Int = 50, after: String, filter: TeamFilter): TeamConnection
  team(id: String!): Team
  issues(filter: IssueFilter, first: Int = 50, after: String, orderBy: PaginationOrderBy): IssueConnection @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  issue(id: String!): Issue @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  myIssueActivity(first: Int = 50, after: String): MyIssueActivityConnection @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  inboxNotifications(first: Int = 50, after: String, unreadOnly: Boolean = false, archived: Boolean = false, snoozed: Boolean = false): InboxNotificationConnection
  inboxUnreadCount: Int!
  projects(filter: ProjectFilter, first: Int = 50, after: String): ProjectConnection
  initiatives(first: Int = 50, after: String, status: String): InitiativeConnection
  initiative(id: String!): Initiative
  projectUpdates(first: Int = 50, after: String, filter: ProjectUpdateFilter): ProjectUpdateConnection
  initiativeUpdates(first: Int = 50, after: String, filter: InitiativeUpdateFilter): InitiativeUpdateConnection
  project(id: String!): Project
  workflowStates(filter: WorkflowStateFilter, first: Int = 100, after: String): WorkflowStateConnection
  cycles(filter: CycleFilter, first: Int = 100, after: String): CycleConnection
  cycle(id: String!): Cycle
  teamCycleCadence(teamId: String!): TeamCycleCadence!
  issueLabels(filter: IssueLabelFilter, first: Int = 100, after: String): IssueLabelConnection @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  searchIssues(term: String!, first: Int = 20, after: String): IssueConnection @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  rateLimitStatus: RateLimitPayload
  "The live merge gate for one linked pull request, read from GitHub now, never from the cached row."
  reviewGate(linkId: String!): ReviewGate!
  """
  Pull requests linked to a task in this workspace, newest link first.

  The Reviews queue reads this. It used to be derived from the newest N tasks and their
  links, which silently emptied the queue once more than N tasks had been touched — the
  queue is a property of the links, not of task recency.
  """
  pullRequests(first: Int = 250): [GithubLink!]!
}

type Mutation {
  apiKeyCreate(label: String!, access: String = "read_write", expiresAt: DateTime): ApiKeyPayload
  apiKeyRevoke(id: String!): Boolean!
  userPreferenceSet(key: String!, value: String!): UserPreferencesPayload!
  profileNameUpdate(name: String!): UserPayload
  notificationPreferenceSet(kind: String!, enabled: Boolean!): NotificationPreferencesPayload!
  workspaceCreate(input: WorkspaceCreateInput!): OrganizationPayload
  teamCreate(input: TeamCreateInput!): TeamPayload
  teamUpdate(id: String!, input: TeamUpdateInput!): TeamPayload
  teamArchive(id: String!): DeletePayload
  teamDelete(id: String!, deleteIssues: Boolean = false): DeletePayload
  workspaceSwitch(organizationId: String!): OrganizationPayload
  membershipInvitationCreate(userId: String!): UserPayload
  membershipInvitationAccept(code: String!, inviteePassword: String!): OrganizationPayload
  membershipInvitationRevoke(userId: String!): DeletePayload
  memberDeactivate(userId: String!): UserPayload
  memberReactivate(userId: String!): UserPayload
  memberArchive(userId: String!): UserPayload
  memberRestore(userId: String!): UserPayload
  workspaceUpdate(input: WorkspaceUpdateInput!): OrganizationPayload
  memberInvite(input: MemberInviteInput!): UserPayload
  memberRoleUpdate(userId: String!, admin: Boolean!): UserPayload
  teamMemberAdd(teamId: String!, userId: String!, role: String = "member"): UserPayload
  teamMemberRemove(teamId: String!, userId: String!): UserPayload
  issueCreate(input: IssueCreateInput!): IssuePayload @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  issueUpdate(id: String!, input: IssueUpdateInput!): IssuePayload @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  notificationMarkRead(id: String!): Boolean!
  notificationArchive(id: String!): Boolean!
  notificationMarkAllRead: Boolean!
  notificationMarkUnread(id: String!): Boolean!
  notificationUnarchive(id: String!): Boolean!
  notificationSnooze(id: String!, until: DateTime): Boolean!
  notificationsMarkReadForIssue(issueId: String!, read: Boolean = true): Boolean!
  notificationsArchiveForIssue(issueId: String!): Boolean!
  notificationsSnoozeForIssue(issueId: String!, until: DateTime): Boolean!
  notificationsArchiveAllRead: Boolean!
  "Read or unread every notification about one subject: a task, project, initiative or cycle."
  notificationsMarkReadForSubject(subjectId: String!, read: Boolean = true): Boolean!
  notificationsArchiveForSubject(subjectId: String!): Boolean!
  "Snooze every notification about one subject until the instant; null brings them back now."
  notificationsSnoozeForSubject(subjectId: String!, until: DateTime): Boolean!
  "Follow a project: its updates, replies to your posts, and status, target date or lead changes reach your inbox. Accepts the id or slugId."
  projectSubscribe(id: String!): Boolean!
  projectUnsubscribe(id: String!): Boolean!
  "Follow an initiative: its updates and status, target date or owner changes reach your inbox."
  initiativeSubscribe(id: String!): Boolean!
  initiativeUnsubscribe(id: String!): Boolean!
  "Hear when a cycle starts and when it completes."
  cycleSubscribe(id: String!): Boolean!
  cycleUnsubscribe(id: String!): Boolean!
  githubLinkAdd(issueId: String!, url: String!): GithubLink!
  "Approve a pull request as the connected GitHub user, attributed to the Hoja actor."
  reviewApprove(linkId: String!, body: String): ReviewActionPayload!
  "Request changes on a pull request. A body is required by GitHub's own review semantics."
  reviewRequestChanges(linkId: String!, body: String!): ReviewActionPayload!
  "Comment on a pull request without approving or requesting changes."
  reviewComment(linkId: String!, body: String!): ReviewActionPayload!
  "Squash-merge exactly `sha`. Refuses when the head moved, checks fail or are undecided, the branch is dirty, or mergeability is unknown."
  reviewMerge(linkId: String!, sha: String!, method: String = "squash"): ReviewActionPayload!
  "Load one file's diff on demand (HOJA-513): fetches it from GitHub, applies the stored cap, and caches it back under `cached: true` when it fits."
  githubFilePatchLoad(linkId: String!, path: String!, sha: String): GithubFilePatchLoadResult!
  issueDelete(id: String!): DeletePayload @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  issueArchive(id: String!): DeletePayload @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  issueSubscribe(id: String!): Boolean! @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  issueUnsubscribe(id: String!): Boolean! @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  commentCreate(input: CommentCreateInput!): CommentPayload
  commentUpdate(id: String!, input: CommentUpdateInput!): CommentPayload
  commentDelete(id: String!): DeletePayload
  issueLabelCreate(input: IssueLabelCreateInput!): IssueLabelPayload @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  issueLabelDelete(id: String!): DeletePayload @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  issueLabelUpdate(id: String!, input: IssueLabelUpdateInput!): IssueLabelPayload @deprecated(reason: "Use the task* field instead; this name is kept as a wire-compatible alias.")
  projectCreate(input: ProjectCreateInput!): ProjectPayload
  projectUpdate(id: String!, input: ProjectUpdateInput!): ProjectPayload
  projectUpdateCreate(input: ProjectUpdateCreateInput!): ProjectUpdatePayload
  projectUpdateUpdate(id: String!, input: ProjectUpdateUpdateInput!): ProjectUpdatePayload
  projectUpdateDelete(id: String!): DeletePayload
  projectArchive(id: String!): DeletePayload
  teamCycleCadenceEnable(teamId: String!, weekday: Int!): TeamCycleCadence!
  cycleUpdate(id: String!, input: CycleUpdateInput!): CyclePayload
  initiativeCreate(input: InitiativeCreateInput!): InitiativePayload
  initiativeUpdate(id: String!, input: InitiativeUpdateInput!): InitiativePayload
  initiativeUpdateCreate(input: InitiativeUpdateCreateInput!): InitiativeUpdatePayload
  initiativeUpdateUpdate(id: String!, input: InitiativeUpdateUpdateInput!): InitiativeUpdatePayload
  initiativeUpdateDelete(id: String!): DeletePayload
  initiativeArchive(id: String!): DeletePayload
  attachmentCreate(input: AttachmentCreateInput!): AttachmentPayload
}

enum PaginationOrderBy { createdAt updatedAt }

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""
One append-only audit event: who asked for what, and the hash that chains it to
the event before it in the same workspace. Admins read this; nothing writes it
through the API, and the storage layer refuses every update and delete.
"""
type AuditEvent {
  seq: Int!
  action: String!
  actorKind: String!
  actorId: String!
  "For an agent turn: the human whose request the agent acted on."
  onBehalfOf: String
  targetKind: String
  targetId: String
  ip: String
  runner: String
  requestId: String
  "Non-secret context only; a credential never appears here."
  detail: String
  prevHash: String!
  rowHash: String!
  createdAt: DateTime!
}

type AuditEventConnection { nodes: [AuditEvent!]! pageInfo: PageInfo! }

type InboxNotification {
  id: ID!
  "What the notification is about: issue, project, initiative or cycle."
  subjectType: String!
  subjectId: ID!
  "Null when the notification is about a project, initiative or cycle."
  issue: Issue
  project: Project
  initiative: Initiative
  cycle: Cycle
  "The project update a post, reply or mention points at; null once deleted."
  projectUpdate: ProjectUpdate
  initiativeUpdate: InitiativeUpdate
  actor: User
  kind: String!
  createdAt: DateTime!
  readAt: DateTime
  archivedAt: DateTime
  snoozedUntil: DateTime
  data: JSON
  comment: Comment
}
type InboxNotificationConnection { nodes: [InboxNotification!]! pageInfo: PageInfo! }

