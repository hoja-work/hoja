type Attachment {
  id: ID!
  url: String!
  title: String!
  subtitle: String
  contentType: String
  issue: Issue
  createdAt: DateTime
}

type GithubLink {
  id: ID!
  "The task this GitHub object is linked to."
  issue: Issue
  kind: String!
  externalId: String!
  url: String!
  title: String!
  state: String
  author: String
  sha: String
  environment: String
  createdAt: DateTime
  updatedAt: DateTime
  additions: Int
  deletions: Int
  baseRef: String
  headRef: String
  behind: Int
  ahead: Int
  mergeable: Boolean
  mergeState: String
  reviewDecision: String
  reviewers: JSON
  checksState: String
  checksTotal: Int
  checksPassing: Int
  checksFailing: Int
  body: String
  mergedAt: DateTime
  githubUpdatedAt: DateTime
  "Per-file diff of the pull request; empty when it is not a pull request or not fetched yet."
  files: [GithubFile!]!
}

"One file changed by a pull request."
type GithubFile {
  path: String!
  additions: Int!
  deletions: Int!
  "added | modified | removed | renamed (GitHub's lesser states fold into modified)."
  status: String!
  "Unified diff. Null when GitHub omits it (binary file) or it exceeded the stored size cap."
  patch: String
  "Old path, only for a rename."
  previousPath: String
  "True when the blob is proven non-text: GitHub legitimately sends no patch for it (HOJA-513)."
  binary: Boolean
  "True when a patch exists but was not stored: over the per-patch cap, over the row budget, or a text diff GitHub refuses to render."
  oversize: Boolean
  "The measured size for an oversize entry: patch characters when a patch exists, blob bytes when GitHub renders nothing."
  oversizeSize: Int
  "True for the empty blob: there is no content to diff."
  empty: Boolean
  "True for a pure rename with no content change."
  unchanged: Boolean
  "True when this patch was loaded on demand and cached back into the row (HOJA-513)."
  cached: Boolean
}

"The merge gate for one pull request, as GitHub reported it at the moment of the call."
type ReviewGate {
  "The commit this gate describes. This is the sha a merge would merge."
  sha: String!
  "GitHub's mergeable flag. Null means GitHub has not computed it yet — not 'yes'."
  mergeable: Boolean
  "clean | dirty | blocked | behind | unstable | draft | unknown"
  mergeState: String
  "success | pending | failure | unknown"
  checksState: String
  checksTotal: Int
  checksPassing: Int
  checksFailing: Int
  checksPending: Int
  "True when GitHub refused the check read itself (the app lacks Checks / Commit statuses), which is not the same as having no checks."
  checksUnavailable: Boolean!
  "open | closed | merged"
  state: String
  title: String
  url: String
  "Why a merge would be refused right now, from the same check the merge itself runs. Null when it would proceed."
  refusalCode: String
  refusalMessage: String
}

"The answer to loading one file's diff on demand (HOJA-513). Every absent patch carries a stable reason: over_cap, github_omitted, not_in_pull, head_moved."
type GithubFilePatchLoadResult {
  path: String!
  "The patch, when one is loadable within the stored cap."
  patch: String
  binary: Boolean
  oversize: Boolean
  oversizeSize: Int
  empty: Boolean
  unchanged: Boolean
  cached: Boolean
  "Why no patch is available, when it is not. Stable codes, not prose."
  reason: String
  "The link with its refreshed files payload."
  link: GithubLink
}

"The result of a review write, returned only after GitHub confirmed it."
type ReviewActionPayload {
  "approve | request_changes | comment | merge"
  action: String!
  "The commit the action applied to."
  sha: String
  "The commit GitHub reports as the merge commit; empty for non-merge actions."
  mergeSha: String
  "The gate read immediately before the action, so the recorded merge names its own state."
  gate: ReviewGate
  "The attributed actor, e.g. 'Hoja, on behalf of Luis'."
  actor: String
  link: GithubLink
}

type RateLimitPayload {
  identifier: String
  kind: String
  limit: Int
  remaining: Int
  requestsPerHour: Int
  resetsAt: DateTime
}

# ---- Filter inputs (comparators hoja emits) ----
input StringComparator {
  eq: String
  neq: String
  in: [String!]
  nin: [String!]
  contains: String
  containsIgnoreCase: String
  eqIgnoreCase: String
}
input IDComparator { eq: ID in: [ID!] neq: ID }
input NumberComparator { eq: Float neq: Float gt: Float lt: Float gte: Float lte: Float in: [Float!] }
input DateComparator { eq: DateTime neq: DateTime gt: DateTime lt: DateTime gte: DateTime lte: DateTime }
input BooleanComparator { eq: Boolean neq: Boolean }

input TeamFilter { key: StringComparator id: IDComparator name: StringComparator }
input UserFilter { id: IDComparator email: StringComparator displayName: StringComparator name: StringComparator }
input WorkflowStateFilter { name: StringComparator type: StringComparator team: TeamFilter }
input CycleFilter { id: IDComparator name: StringComparator team: TeamFilter isActive: BooleanComparator isNext: BooleanComparator }
input ProjectRelFilter { id: IDComparator name: StringComparator }
input LabelRelFilter { name: StringComparator }

input IssueFilter {
  identifier: StringComparator
  team: TeamFilter
  state: WorkflowStateFilter
  assignee: UserFilter
  creator: UserFilter
  project: ProjectRelFilter
  cycle: CycleFilter
  parent: IssueParentFilter
  labels: LabelRelFilter
  priority: NumberComparator
  number: NumberComparator
  title: StringComparator
  description: StringComparator
  updatedAt: DateComparator
  createdAt: DateComparator
  dueDate: DateComparator
  and: [IssueFilter!]
  or: [IssueFilter!]
}

input ProjectFilter { id: IDComparator slugId: StringComparator name: StringComparator state: StringComparator team: TeamFilter }
input IssueParentFilter {
  id: IDComparator
  "Hoja extension: true selects issues with no parent, false only issues that have one."
  isNull: Boolean
}
input IssueLabelFilter { team: TeamFilter name: StringComparator }

