services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoja}
      POSTGRES_USER: ${POSTGRES_USER:-hoja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - hoja-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      HOJA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hoja}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hoja}
      # Meetings (optional): Cloudflare Realtime SFU app + TURN key. Unset = meetings work, media returns 503.
      HOJA_CF_REALTIME_APP_ID: ${HOJA_CF_REALTIME_APP_ID:-}
      HOJA_CF_REALTIME_APP_SECRET: ${HOJA_CF_REALTIME_APP_SECRET:-}
      HOJA_CF_TURN_KEY_ID: ${HOJA_CF_TURN_KEY_ID:-}
      HOJA_CF_TURN_KEY_API_TOKEN: ${HOJA_CF_TURN_KEY_API_TOKEN:-}
      HOJA_APP_URL: ${HOJA_APP_URL:-}
    ports:
      - "${HOJA_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  hoja-postgres:
